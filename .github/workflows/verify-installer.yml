name: Verify TV installer URL

on:
  push:
    paths:
      - '.github/workflows/verify-installer.yml'
      - 'a.js'
      - 'lampa-anime-filler.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub Pages and short URL
        shell: bash
        run: |
          set -euo pipefail
          base='https://nmagic.github.io/lampa-anime-filler'
          curl --fail --silent --show-error --location --max-time 30 "$base/a.js" --output /tmp/installer.js
          grep -q 'Lampa' /tmp/installer.js
          curl --fail --silent --show-error --location --max-time 30 "$base/lampa-anime-filler.js" --output /tmp/plugin.js
          grep -q 'marking-only prototype 0.2.0' /tmp/plugin.js
          dest="$(curl --fail --silent --show-error --location --max-time 30 -w '%{url_effective}' 'https://is.gd/lampaaf' -o /tmp/short.js)"
          [[ "$dest" == "$base/a.js" ]]
          cmp -s /tmp/short.js /tmp/installer.js
          echo "Validated https://is.gd/lampaaf -> $dest; loader and plugin return JavaScript."

      - name: Diagnose CORS and redirect compatibility with Lampa
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for url in 'https://is.gd/lampaaf' 'https://nmagic.github.io/lampa-anime-filler/a.js'; do
            echo "----- $url -----"
            curl -sS --max-time 20 --location --dump-header /tmp/cors-headers \
              -H 'Origin: https://lampa.mx' -o /tmp/cors-body "$url"
            grep -iE '^(HTTP/|location:|access-control-allow-origin:|content-type:|vary:)' /tmp/cors-headers || true
            echo "Body bytes: $(wc -c < /tmp/cors-body)"
          done
          echo 'GET with Lampa-added query parameters:'
          curl -sS --max-time 20 --location --dump-header /tmp/query-headers -o /tmp/query-body \
            'https://is.gd/lampaaf?logged=false&reset=123&origin=dGVzdA=='
          grep -iE '^(HTTP/|location:|access-control-allow-origin:|content-type:)' /tmp/query-headers || true
          echo "Final bytes: $(wc -c < /tmp/query-body)"
